# vwap_ma_strategy/config/vwap_ma_config.yaml
strategy:
  name: "vwap_ma_scalping"
  version: "1.1"  # Updated version
  
symbols:
  primary: "SPY"
  secondary: "QQQ"
  enabled: ["SPY", "QQQ"]

options:
  trade_underlying: true      
  contract_size: 100          # FIX: Trade 100 shares instead of 1
  expiration: 1
  delta_target: 0.40
  max_premium: 200

indicators:
  ma_fast: 9
  ma_slow: 21
  vwap_period: "daily"
  atr_period: 14
  volume_period: 20

entry_rules:
  require_pullback: false
  pullback_min_candles: 1
  confirmation_candle: true
  min_volume_ratio: 1.5

exit_rules:
  profit_target_pct: 0.8      # FIX: 0.8% for shares = ~32% for options (0.4 delta * 20x)
  stop_loss_pct: 0.4          # FIX: 0.4% for shares = ~16% for options
  hedge_trigger: 20
  hedge_cost_ratio: 0.25
  market_close_exit: true
  exit_before_minutes: 60

position_management:
  max_trades_per_day: 5
  max_position_size: 1
  allow_multiple_positions: false

risk_management:
  max_loss_per_trade: 100
  max_daily_loss: 500
  max_drawdown: 1000

trading_hours:
  morning_start: "09:35"  
  morning_end: "16:00"    
  afternoon_start: "09:35" 
  afternoon_end: "16:00"
  avoid_first_minutes: 5
  avoid_last_minutes: 30

market_filters:
  min_atr_percentage: 0.002
  min_volume_ratio: 1.0
  max_bid_ask_spread: 0.5
  vix_max: 25

backtest:
  data_path: "../data/historical/"
  commission_per_trade: 0.65
  slippage_per_trade: 0.01

logging:
  level: "INFO"
  save_signals: true