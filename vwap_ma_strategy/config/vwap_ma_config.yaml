# vwap_ma_strategy/config/vwap_ma_config.yaml
strategy:
  name: "vwap_ma_scalping"
  version: "1.0"
  
symbols:
  primary: "SPY"
  secondary: "QQQ"
  enabled: ["SPY", "QQQ"]

options:
  trade_underlying: true      # New flag to trade SPY/QQQ directly
  contract_size: 100          # Shares per "contract" (100 for standard lots)
  expiration: 1
  delta_target: 0.40
  max_premium: 200

indicators:
  ma_fast: 9
  ma_slow: 21
  vwap_period: "daily"
  atr_period: 14
  volume_period: 20

entry_rules:
  require_pullback: false
  pullback_min_candles: 1
  confirmation_candle: true
  min_volume_ratio: 1.5

exit_rules:
  profit_target_pct: 0.15   # 0.15% price move for TP
  stop_loss_pct: 0.08       # 0.08% price move for SL
  # Remove or comment out the premium-based targets:
  # profit_target: 20
  # stop_loss: 50
  hedge_trigger: 20
  hedge_cost_ratio: 0.25
  market_close_exit: true
  exit_before_minutes: 60

position_management:
  max_trades_per_day: 5
  max_position_size: 1
  allow_multiple_positions: false

risk_management:
  max_loss_per_trade: 100
  max_daily_loss: 500
  max_drawdown: 1000

trading_hours:
  morning_start: "09:35"  # 9:35 AM EST
  morning_end: "16:00"    # 4:00 PM EST (full trading day)
  afternoon_start: "09:35" # Same as morning - full continuous session
  afternoon_end: "16:00"
  avoid_first_minutes: 5
  avoid_last_minutes: 30

market_filters:
  min_atr_percentage: 0.002
  min_volume_ratio: 1.0
  max_bid_ask_spread: 0.5
  vix_max: 25

backtest:
  data_path: "../data/historical/"
  commission_per_trade: 0.65
  slippage_per_trade: 0.01

logging:
  level: "INFO"
  save_signals: true
  save_trades: true