# config/scalping_config.yaml
trading:
  max_position_value: 200
  max_daily_trades: 10
  instruments: ["SPY", "QQQ"]
  avoid_open_minutes: 15    # NEW
  avoid_close_minutes: 30   # NEW
  
risk:
  stop_loss_pct: 30
  take_profit_pct: 20 
  hedge_activation_pct: 20
  max_hold_minutes: 20
  
options:
  enabled: true
  strike_selection: "1_OTM"  # Options: "ATM", "1_OTM", "1_ITM"
  default_delta: 0.5       # ATM is ~0.5 delta, 1 OTM is ~0.3-0.4 delta
  days_to_expiry: 1        # Use next day expiration for scalping
  rolling_enabled: true
  profit_targets: [25, 50, 75]
  delta_steps: [0.5, 0.3, 0.2, 0.1]  # Adjusted for ATM/OTM starting points
  
backtesting:
  initial_capital: 20000
  commission: 0.65
  slippage: 0.01

strategy:
  heikin_ashi_period: 3
  ma_fast_period: 9
  ma_slow_period: 21
  min_volume: 1000
  max_volatility: 2.0       # NEW
  rsi_period: 14            # NEW
  rsi_oversold: 30          # NEW
  rsi_overbought: 70        # NEW